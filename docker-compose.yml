version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reactor-adapter
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Europe/Moscow
    volumes:
      - ./logs:/app/logs
    networks:
      - reactor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/stocks/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  reactor-network:
    driver: bridge
